name: Build & Audit

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        run: ./node_modules/.bin/astro build
        env:
          PUBLIC_SITE_URL: https://suite.andrexthe.dev

      - name: Policy-Audit (dist)
        run: node scripts/audit-dist.mjs

      - name: Dependency audit (prod, critical)
        run: npm run audit:deps

      - name: Dependency audit (full, all severities) — informational
        run: npm audit --audit-level=high || true

      - name: Demo-Regression (142 Checks)
        run: node --experimental-strip-types scripts/verify-demos.mjs
